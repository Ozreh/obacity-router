<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пешеходный навигатор: Обама, Япония</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root { --bg:#fff; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --a:#16a34a; --b:#dc2626; }
@media (prefers-color-scheme: dark) {
    :root { --bg:#1f2937; --fg:#f3f4f6; --muted:#9ca3af; --line:#374151; --accent:#60a5fa; }
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; font-family:system-ui, -apple-system, "Segoe UI", sans-serif; }
#map { width:100vw; height:100vh; }
.panel {
    position:absolute; top:12px; right:12px; z-index:1000; width:300px;
    background:var(--bg); color:var(--fg); border-radius:14px; padding:16px;
    box-shadow:0 6px 24px rgba(0,0,0,.25);
}
.panel h3 { margin:0 0 12px; font-size:17px; }
.step { display:flex; align-items:center; gap:10px; padding:8px 0; color:var(--muted); font-size:14px; }
.step + .step { border-top:1px solid var(--line); }
.step.active { color:var(--fg); font-weight:600; }
.step.done { color:var(--fg); }
.dot { width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; flex:none; }
.dot.a { background:var(--a); }
.dot.b { background:var(--b); }
.step small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
#status { margin:12px 0; font-size:14px; min-height:20px; }
#status.error { color:var(--b); }
.summary { display:none; gap:8px; margin-bottom:12px; }
.summary.show { display:flex; }
.stat { flex:1; background:var(--line); border-radius:10px; padding:8px 10px; }
.stat b { display:block; font-size:18px; }
.stat span { font-size:11px; color:var(--muted); }
.row { display:flex; gap:8px; }
.row button { flex:1; }
button {
    font:inherit; font-size:13px; padding:9px 10px; border-radius:9px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--fg);
}
button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary:hover:not(:disabled) { color:#fff; opacity:.9; }
select { width:100%; font:inherit; font-size:14px; padding:9px 10px; margin-top:8px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
.row + .row { margin-top:8px; }
.pin {
    width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    display:grid; place-items:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.pin span { transform:rotate(45deg); color:#fff; font-weight:700; font-size:13px; }
.pin.a { background:var(--a); }
.pin.b { background:var(--b); }
.loading .leaflet-container { cursor:progress; }
.userbar { display:none; justify-content:space-between; align-items:center; gap:8px; margin:-4px 0 10px; font-size:13px; color:var(--muted); }
.userbar.show { display:flex; }
.userbar span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.userbar button { flex:none; padding:5px 10px; font-size:12px; }
.hidden { display:none !important; }
.checking .panel, .checking #map { visibility:hidden; }
.search { position:absolute; top:12px; left:12px; z-index:1000; width:320px; max-width:calc(100vw - 24px); }
#search-input { width:100%; font:inherit; font-size:14px; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); box-shadow:0 6px 24px rgba(0,0,0,.25); }
#search-input:focus { outline:none; border-color:var(--accent); }
#search-results { margin:6px 0 0; padding:4px; list-style:none; background:var(--bg); color:var(--fg); border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
#search-results li { padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
#search-results li:hover, #search-results li.active { background:var(--line); }
.checking .search { visibility:hidden; }
@media (max-width:600px) {
    .panel { top:auto; bottom:0; right:0; left:0; width:auto; border-radius:14px 14px 0 0; }
}
</style>
</head>
<body>
<div class="panel">
    <h3>Пешеходный навигатор</h3>
    <div class="step" id="stepA"><div class="dot a">A</div><div>Старт<small id="coordA">не выбран</small></div></div>
    <div class="step" id="stepB"><div class="dot b">B</div><div>Финиш<small id="coordB">не выбран</small></div></div>
    <select id="profile">
        <option value="fastest">Быстрый</option>
        <option value="shortest">Короткий</option>
        <option value="comfort">Комфортный</option>
        <option value="eco">Без холмов</option>
    </select>
    <div id="status">Кликните на карте, чтобы поставить старт</div>
    <div class="summary" id="summary">
        <div class="stat"><b id="dist">—</b><span>расстояние</span></div>
        <div class="stat"><b id="time">—</b><span>пешком</span></div>
    </div>
    <div class="row">
        <button id="locate">Моё место</button>
        <button id="swap" disabled>⇅ Поменять</button>
    </div>
    <div class="row">
        <button id="fit" disabled>Показать весь путь</button>
        <button id="reset" class="primary">Сбросить</button>
    </div>
</div>
<div class="search">
    <input id="search-input" type="search" autocomplete="off" placeholder="Улица, дом" aria-label="Поиск адреса">
    <ul id="search-results" hidden></ul>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script src="search-box.js"></script>
<script src="script.js"></script>
</body>
</html>
